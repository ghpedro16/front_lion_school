<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./js/script.js" defer type="module"></script>
    <script src="./js/main.js" defer type="module"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <title>Lion School</title>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="./img/logo-image.png" alt="">
            <h1>Lion School</h1>
        </div>

        <div class="sair">
            <img src="./img/icone_sair.png" alt="">
            <h1>Sair</h1>
        </div>
    </header>
    <main id="main">
        <div class="dispositivos">
            <h2>Escolha um <span class="curso">curso</span> para gerenciar</h2>
            <img src="./img/dispositivos.png" alt="">
        </div>
        <div class="estudante">
            <img src="./img/studant.png" alt="">
        </div>
        <div class="cursos">
            <button class="ds" id="DS">
                <img src="./img/icon_ds.png" alt="">
                <span>DS</span>
            </button>
            <button class="redes" id="REDES">
                <img src="./img/icon_redes.png" alt="">
                <span>REDES</span>
            </button>
        </div>

        <div clas="container" id="container"></div>
    </main>
    <footer class="rodape">
        <div class="contatos">
            <ul class="list-contatos">
                <li>
                    <img src="./img/icone_telefone.png" alt="">
                    <span>(11) 4774-4700</span>
                </li>
                <li>
                    <img src="./img/icon-email.png" alt="">
                    <span>lionschool@gmail.com</span>
                </li>
                <li>
                    <img src="./img/icone_local.png" alt="">
                    <span>Rua tcc, 211,  Centro, Jandira</span>
                </li>
            </ul>
        </div>
        <div class="copyright">
            <span>Copyright © 2026 | Pedro Henrique </span>
        </div>
        <div class="midias-sociais">
            <img src="./img/icon_yt.png" alt="">
            <img src="./img/twitter.png" alt="">
            <img src="./img/instagram.png" alt="">
            <img src="./img/facebook.png" alt="">
        </div>
    </footer>
</body>
</html>
